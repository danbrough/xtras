project.description="Extra support for Kotlin Multiplatform"
project.group=org.danbrough
#
publish.local=true
publish.sonatype=true
publish.xtras=true
publish.docs=1
publish.sign=1
#
#sonatype.baseURL=https://s01.oss.sonatype.org
org.gradle.daemon=true
org.gradle.jvmargs=-XX\:MaxMetaspaceSize\=2G -Xmx2048m -Xss32m
#org.gradle.caching=true
org.gradle.configuration-cache=true
#org.gradle.unsafe.configuration-cache=true
#Android
#android.disableAutomaticComponentCreation=true
android.useAndroidX=true
android.enableJetifier=true
#Kotlin
kotlin.code.style=official
#kotlin.mpp.enableCInteropCommonization=true
#kotlin.native.binary.memoryModel=experimental
kotlin.native.ignoreDisabledTargets=true
#kotlin.mpp.stability.nowarn=true
kotlin.mpp.applyDefaultHierarchyTemplate=true
#kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
#kotlin.mpp.enableCInteropCommonization.nowarn=true
kotlin.mpp.enableCInteropCommonization=true
#org.jetbrains.dokka.experimental.gradle.pluginMode=V2EnabledWithHelpers
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
#xtras2.message=Hello World! from gradle.properties
#
#sodium library default settings
sodium.version=1.0.20
sodium.git.commit=1.0.20-RELEASE
sodium.git.url=https://github.com/jedisct1/libsodium
#
#zmq library default settings
zmq.version=4.3.5
zmq.git.commit=v4.3.5
zmq.git.url=https://github.com/zeromq/libzmq.git
#
#
#openssl library default settings
openssl.version=3.5.0-beta01
openssl.git.commit=openssl-3.5.0
openssl.git.url=https://github.com/openssl/openssl
#
#sqlite library default settings
#sqlite.version=3.51.0
#sqlite.git.commit=version-3.51.0
sqlite.version=3.46.1
sqlite.git.commit=version-3.46.1
